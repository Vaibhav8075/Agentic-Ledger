version: "phinite.agent-graph/v1"
metadata:
  name: "paytm-vyapar-saathi-orchestrator"
  display_name: "Paytm Vyapar Saathi: Autonomous Soundbox Anti-Fraud & Liquidity Balancer"
  track: "Track 2 - AI for Small Businesses"
  version: "1.0.0"
  description: "Enterprise multi-agent graph on Phinite orchestrating IoT Soundbox telemetry, spoof detection, multimodal invoice extraction, and EMI-protected micro-settlement."

# Runtime Environment Variables & Secret Bindings
environment:
  PAYTM_MID: "HelloM8xxxxxxxx45"
  PAYTM_MERCHANT_KEY: ""  # inject from the platform secret store at deploy time; never commit a key
  PAYTM_SETTLEMENT_ENDPOINT: "https://secure.paytmpayments.com/merchant-settlement/SettlementOrderDetail"
  SOUNDBOX_MQTT_BROKER: "ssl://iot-mqtt.paytm.com:8883"
  SPOOF_GUARD_LATENCY_BUDGET_MS: 600
  DAILY_LOAN_EMI_DEFAULT: 3000.00
  CURRENCY: "INR"

# Messaging & Telemetry Ingress Triggers
triggers:
  - id: "mqtt_telemetry_stream"
    type: "event_stream"
    protocol: "mqtt_websocket"
    topic: "merchants/${env.PAYTM_MID}/soundbox/telemetry"
    qos: 1
    target_node: "supervisor_agent"

  - id: "whatsapp_invoice_webhook"
    type: "webhook"
    protocol: "https"
    endpoint: "/api/v1/webhooks/whatsapp"
    target_node: "supervisor_agent"

  - id: "p4b_deeplink_action_tap"
    type: "app_action"
    source: "paytm_for_business_app"
    target_node: "supervisor_agent"

# State Machine Shared Across Graph Execution
state_schema:
  merchant_id: "string"
  device_imei: "string"
  current_unsettled_balance: "number"
  daily_loan_emi: "number"
  pending_invoices: "array"
  active_settlements: "array"
  telemetry_status: "string"
  last_verified_txn: "object"
  pii_sanitized: "boolean"
  security_audit_trail: "array"

# Node Topology: Master, Child Workers, Deterministic Script Nodes, and Gateways
nodes:
  # -------------------------------------------------------------
  # MASTER / SUPERVISORY AGENT
  # -------------------------------------------------------------
  - id: "supervisor_agent"
    type: "agent"
    role: "Master Orchestration & State Machine Coordinator"
    model: "claude-3-5-sonnet"
    system_prompt: |
      You are the Paytm Vyapar Saathi Master Orchestrator operating on the Phinite Platform.
      Your responsibility is to manage the merchant state machine, dispatch incoming events to specialized
      child agents, maintain the unsettled T+1 balance, and enforce strict financial safety policies.
      Rules:
      1. Never perform financial arithmetic directly in text; always route to the deterministic Liquidity Engine.
      2. If an event is an unverified payment or Soundbox silence, immediately invoke Worker 1 (Spoof Guard).
      3. If an event is a vendor bill or delivery receipt, invoke Worker 2 (Supplier Ledger).
      4. If a settlement is requested, route through the Maker-Checker guardrail before executing payouts.
      5. Ensure zero PII leakage by routing raw inputs through the PII Redaction filter.
    inputs:
      - "trigger_payload"
      - "current_state"
    outputs:
      - "dispatch_action"
      - "state_update"

  # -------------------------------------------------------------
  # DETERMINISTIC GUARDRAIL: PII SANITIZATION
  # -------------------------------------------------------------
  - id: "pii_redaction_guardrail"
    type: "script_node"
    runtime: "python3.11"
    description: "Masks card, Aadhaar, phone, bank account, PAN, IFSC and VPA before LLM consumption (same patterns as agents/guardrails.py)."
    code: |
      import re
      PII_PATTERNS = [
          ("[REDACTED_CARD]", r"\b(?:\d{4}[ -]){3}\d{4}\b"),
          ("[REDACTED_AADHAAR]", r"\b[2-9]\d{3}[ -]?\d{4}[ -]?\d{4}\b"),
          ("[REDACTED_PHONE]", r"(?:\+91[ -]?)?\b[6-9]\d{4}[ -]?\d{5}\b"),
          ("[REDACTED_BANK_ACC]", r"\b\d{9,18}\b"),
          ("[REDACTED_PAN]", r"\b[A-Z]{5}[0-9]{4}[A-Z]\b"),
          ("[REDACTED_IFSC]", r"\b[A-Z]{4}0[A-Z0-9]{6}\b"),
          ("[REDACTED_VPA]", r"\b[\w.-]+@[\w-]+(?:\.[\w-]+)*\b"),
      ]
      def sanitize(payload):
          text = str(payload.get("raw_text", ""))
          original = text
          for label, pattern in PII_PATTERNS:
              text = re.sub(pattern, label, text)
          payload["raw_text"] = text
          payload["pii_sanitized"] = text != original
          return payload

  # -------------------------------------------------------------
  # CHILD WORKER 1: SOUNDBOX TELEMETRY & SPOOF GUARD
  # -------------------------------------------------------------
  - id: "spoof_guard_agent"
    type: "agent"
    role: "Sub-600ms Real-Time Spoof & MQTT Lag Validator"
    model: "claude-3-5-haiku"
    latency_sla_ms: 600
    system_prompt: |
      You are the Spoof Guard Agent on Phinite. Your sole job is to cross-reference payment gateway hashes
      against Soundbox MQTT QoS 1 telemetry.
      If the gateway hash exists and MQTT PUBLISH is recorded, but PUBACK is delayed due to 2G cellular congestion,
      flag as 'AUDIO_DELAYED' and trigger a calming P4B push notification.
      If no gateway record exists, immediately flag as 'SPOOF_DETECTED'.
      Always complete your evaluation under 600ms.
    tools:
      - "verify_soundbox_packet_receipt"
    transitions:
      on_spoof: "trigger_p4b_fraud_alert"
      on_lag: "trigger_p4b_audio_delayed_card"
      on_verified: "update_ledger_success"

  # -------------------------------------------------------------
  # CHILD WORKER 2: SUPPLIER LEDGER & INVOICE PARSING
  # -------------------------------------------------------------
  - id: "supplier_ledger_agent"
    type: "agent"
    role: "Multimodal Distributor Bill & Obligation Parser"
    model: "claude-3-5-sonnet"
    system_prompt: |
      You extract structured debt obligations from unstructured WhatsApp/SMS distributor messages.
      Extract vendor_id, vendor_name, due_amount (as exact float), cutoff_time (ISO 8601), and line items.
      Format output to match the Phinite parse_supplier_bill_payload schema.
    tools:
      - "parse_supplier_bill_payload"
    transitions:
      on_extracted: "liquidity_engine_agent"

  # -------------------------------------------------------------
  # CHILD WORKER 3: LIQUIDITY ENGINE & SETTLEMENT OPTIMIZER
  # -------------------------------------------------------------
  - id: "liquidity_engine_agent"
    type: "agent"
    role: "Deterministic Working Capital & Cashflow Optimizer"
    system_prompt: |
      You evaluate supplier settlement requests against daily loan EMI commitments.
      Never allow a settlement that impairs the merchant's 05:00 AM automated EMI deduction.
      Invoke simulate_cashflow_trajectory to run deterministic mathematics.
    tools:
      - "simulate_cashflow_trajectory"
    transitions:
      on_passed: "maker_checker_assertion"
      on_insufficient_float: "trigger_liquidity_shortfall_advisory"

  # -------------------------------------------------------------
  # DETERMINISTIC GUARDRAIL: MAKER-CHECKER MATHEMATICAL ASSERTION
  # -------------------------------------------------------------
  - id: "maker_checker_assertion"
    type: "script_node"
    runtime: "python3.11"
    description: "Re-checks the Liquidity Engine's plan (same rules as agents/guardrails.py::check_payment_plan)"
    code: |
      def assert_liquidity(context):
          balance = float(context["current_unsettled_balance"])
          due = float(context["requested_settlement"])
          emi = float(context["daily_loan_emi"])
          floor = float(context["evening_forecast_floor"])
          limit = float(context["advance_limit"])
          settle = float(context["recommended_micro_settlement"])
          advance = float(context["advance_amount"])

          safe_now = max(0.0, balance - emi)
          violations = []
          if settle > safe_now + 0.01:
              violations.append("settlement eats into the EMI reserve")
          if advance > min(floor, limit) + 0.01:
              violations.append("advance exceeds the forecast floor or the advance limit")
          if settle + advance > due + 0.01:
              violations.append("plan pays more than the bill")
          if violations:
              context["assertion_status"] = "FAILED"
              context["violations"] = violations
              raise ValueError("Maker-checker rejected the payment plan: " + "; ".join(violations))
          context["assertion_status"] = "PASSED"
          return context

  # -------------------------------------------------------------
  # PAYTM GATEWAY INTEGRATION: HMAC-SHA256 SIGNER & EXECUTOR
  # -------------------------------------------------------------
  - id: "hmac_settlement_executor"
    type: "tool_node"
    tool: "execute_targeted_micro_settlement"
    pre_execution_script: |
      import hashlib, hmac, json, time
      def sign_request(body, secret_key):
          # Sign the exact bytes sent (canonical JSON) plus the timestamp, as agents/guardrails.py does.
          # The caller generates order_id once and reuses it, and the idempotency key, on every retry.
          raw = json.dumps(body, sort_keys=True, separators=(",", ":")).encode("utf-8")
          ts = str(int(time.time()))
          signature = hmac.new(secret_key.encode("utf-8"), raw + ts.encode("utf-8"), hashlib.sha256).hexdigest()
          headers = {"X-Paytm-Signature": signature, "X-Paytm-Timestamp": ts,
                     "X-Idempotency-Key": "IDEMP_" + body["order_id"]}
          return raw, headers
    error_handler:
      on_http_504: "npci_udir_idempotent_poller"

  # -------------------------------------------------------------
  # RECOVERY NODE: NPCI UDIR IDEMPOTENT POLLER
  # -------------------------------------------------------------
  - id: "npci_udir_idempotent_poller"
    type: "script_node"
    runtime: "python3.11"
    description: "After a 504, asks the switch for the order's status instead of paying again; retries only with the same idempotency key."
    code: |
      import time
      def recover_after_timeout(http, order_id, resend_same_request, checks=3):
          for attempt in range(checks):
              resp = http.get(f"/api/v1/settlement/status/{order_id}")
              if resp.status_code == 200:
                  return {"status": "RECOVERED", "order": resp.json()}   # e.g. UDIR TCC102: credited after timeout
              time.sleep(0.2 * (attempt + 1))
          # 404 = the order never reached the bank, so resending the same signed body and key is safe
          return {"status": "RETRIED", "order": resend_same_request()}

# Directed Graph Edges
edges:
  - from: "mqtt_telemetry_stream"
    to: "supervisor_agent"

  - from: "whatsapp_invoice_webhook"
    to: "pii_redaction_guardrail"

  - from: "pii_redaction_guardrail"
    to: "supplier_ledger_agent"

  - from: "supplier_ledger_agent"
    to: "liquidity_engine_agent"

  - from: "liquidity_engine_agent"
    to: "maker_checker_assertion"

  - from: "maker_checker_assertion"
    to: "supervisor_agent"

  - from: "supervisor_agent"
    to: "p4b_deeplink_action_tap"

  - from: "p4b_deeplink_action_tap"
    to: "hmac_settlement_executor"
